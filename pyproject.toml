[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navidrome-scripts"
version = "0.14.0"
description = "Navidrome ratings and music library review tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.32", "python-dotenv>=1.0", "mutagen>=1.47"]

[project.optional-dependencies]
tags = ["mediafile>=0.17"]
matching = ["beets>=2.14.1,<3"]
test = ["imageio-ffmpeg>=0.6"]

[project.scripts]
navidrome-artist-ratings = "navidrome_scripts.artist_ratings:main"
navidrome-library-review = "navidrome_scripts.library_review:main"
navidrome-dates = "navidrome_scripts.dates:main"
navidrome-playlists = "navidrome_scripts.playlists:main"
navidrome-unmapped = "navidrome_scripts.unmapped:main"
navidrome-maintenance = "navidrome_scripts.maintenance:main"
navidrome-duplicates = "navidrome_scripts.duplicates:main"
navidrome-guard = "navidrome_scripts.navidrome_guard:main"
navidrome-renames = "navidrome_scripts.renames:main"
navidrome-tags = "navidrome_scripts.tag_repair:main"

[tool.setuptools.packages.find]
include = ["navidrome_scripts*"]
